[package]
name = "macintosh-js"
version = "1.2.0"
authors = ["Felix Rieseberg"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lib]
name = "macintosh_js_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
ppc = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
smoltcp = { version = "0.14", default-features = false, features = ["std", "alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
